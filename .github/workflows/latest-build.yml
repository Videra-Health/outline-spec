name: Latest build

# Every push to main replaces the `latest` release's tarball: the CLI installed with its runtime
# dependencies, so a workflow untars it and runs `bin/outline-spec` with no npm and no build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: latest-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-node's pnpm cache runs before `corepack enable` puts pnpm on the PATH.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      # The review page's Mermaid must match the validator's, and pr-page.yml depends on validate --markdown.
      - name: Check Mermaid
        run: pnpm exec vitest run test/core/mermaid-version.test.ts test/cli-e2e/validate-markdown.test.ts
      - name: Pack with runtime dependencies
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/pkg" "$RUNNER_TEMP"/outline-spec-*.tgz
          "$RUNNER_TEMP/pkg/bin/outline-spec" --version
          # The shipped tree must load jsdom and Mermaid: a good file passes and a bad one fails.
          "$RUNNER_TEMP/pkg/bin/outline-spec" validate --markdown test/fixtures/markdown-mermaid/good.md
          if "$RUNNER_TEMP/pkg/bin/outline-spec" validate --markdown test/fixtures/markdown-mermaid/bad.md --json > "$RUNNER_TEMP/bad.json"; then
            echo "validate --markdown passed a diagram that doesn't parse" >&2; exit 1
          fi
          grep -q '"error": "Parse error' "$RUNNER_TEMP/bad.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pkg/COMMIT"
          tar -czf "$RUNNER_TEMP/outline-spec.tar.gz" -C "$RUNNER_TEMP/pkg" .
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest main" --notes "Built from $GITHUB_SHA"
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload latest "$RUNNER_TEMP/outline-spec.tar.gz" --clobber
          gh release edit latest --notes "Built from $GITHUB_SHA"
